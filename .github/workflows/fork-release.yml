# Unsigned desktop builds for forks, on GitHub-hosted runners. release.yml only
# runs in pingdotgg/t3code (Blacksmith runners, signing and deploy secrets).
#
#   gh workflow run fork-release.yml -f version=0.1.9
name: Fork Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, for example 0.1.9"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.label }}
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows packages on Linux, as release.yml does.
          - label: Windows x64
            runner: ubuntu-24.04
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: macOS arm64
            # GitHub's hosted macOS arm64 pool drops queued jobs (Nov 2026), so this
            # builds on the maintainer's own Mac.
            runner: [self-hosted, t3-mac]
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
    steps:
      # The vendored .repos tree has orphaned gitlinks that break actions/checkout.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # A self-hosted workspace keeps the previous run's files, release/ included.
          find . -mindepth 1 -delete
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      # The cached ~/.vite-plus from hosted runners symlinks into /Users/runner.
      - name: Setup dependencies
        if: runner.environment != 'self-hosted'
        uses: ./.github/actions/setup-ci-deps

      - name: Setup dependencies (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/vite-plus/bin/vp" install

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install cargo-xwin
        if: matrix.platform == 'win'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Build Windows resource monitor
        if: matrix.platform == 'win'
        run: |
          cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.rust_target }}
          echo "T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR=true" >> "$GITHUB_ENV"

      - name: Build desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Squirrel.Mac installs only an update signed like the running app; the self-hosted
          # Mac's login keychain holds this self-signed identity, trusted for code signing.
          CSC_NAME: ${{ matrix.platform == 'mac' && 'T3 Code Local' || '' }}
          # The updater only offers a strictly newer version, so every build gets its own.
          VERSION: ${{ inputs.version }}-fork.${{ github.run_number }}
        run: >-
          vp run dist:desktop:artifact
          --platform ${{ matrix.platform }}
          --target ${{ matrix.target }}
          --arch ${{ matrix.arch }}
          --build-version "$VERSION"
          --verbose

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: desktop
    # Publish whichever platforms built.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="fork-v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "T3 Code ${VERSION}-fork.${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned build of ${GITHUB_SHA::10}. Windows SmartScreen warns about an unknown publisher; on macOS run \`xattr -dr com.apple.quarantine \"/Applications/T3 Code (Beta).app\"\` after copying the app."
